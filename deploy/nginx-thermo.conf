# thermo.paulandrewsullivan.com — the server site.
# Static files from the bind-mounted server-site/ folder; API proxied to thermo-api.
server {
    listen 80;
    server_name thermo.paulandrewsullivan.com;
    root /usr/share/nginx/html;
    index index.html;

    types {
        text/html                 html;
        text/css                  css;
        text/javascript           js mjs;
        model/gltf-binary         glb;
        application/json          json;
        image/png                 png;
        image/svg+xml             svg;
        text/plain                txt md;
    }

    gzip on;
    gzip_types text/css text/javascript application/json model/gltf-binary;

    location /api/ {
        proxy_pass http://thermo-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store";
    }

    location = /ingest {
        proxy_pass http://thermo-api:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    location = /healthz {
        proxy_pass http://thermo-api:8080;
    }

    location ~* \.(glb|js|css)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
