# thermo-esp32.paulandrewsullivan.com — the lean page the ESP32 can serve itself.
# On the server it is the same single file, with the API proxied to thermo-api
# so the page behaves exactly as it would against the board.
server {
    listen 80;
    server_name thermo-esp32.paulandrewsullivan.com;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://thermo-api:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        proxy_pass http://thermo-api:8080;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
