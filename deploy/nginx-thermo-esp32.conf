# thermobox.paulandrewsullivan.com — the page the box used to serve itself, now
# served from here so it is still up while the box is switched off. The API is
# proxied to thermo-api, so the page behaves exactly as it did against the board.
server {
    listen 80;
    server_name thermobox.paulandrewsullivan.com thermo-esp32.paulandrewsullivan.com;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://thermo-api:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store";
    }

    # Where the box reports its readings. Without this the board's posts land
    # on the static root and come back 404.
    location = /ingest {
        proxy_pass http://thermo-api:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store";
    }

    # The electric eye's reports. Same reason as /ingest above.
    location = /eye/ingest {
        proxy_pass http://thermo-api:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        proxy_pass http://thermo-api:8080;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
